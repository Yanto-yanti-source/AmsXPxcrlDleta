<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Tools · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-panel">
    <div class="login-header">
      <span class="login-system">DELTA/TOOLS</span>
      <span class="login-version">ADMIN CONSOLE</span>
    </div>
    <div class="login-sep"></div>
    <div class="login-prompt">
      <span class="prompt-caret">&gt;_</span>
      <span class="prompt-text">authenticate</span>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginEmail">EMAIL</label>
        <input type="email" id="loginEmail" required spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">PASSWORD</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn-enter" id="loginBtn">
        <span id="loginBtnText">ENTER</span>
      </button>
      <div id="loginErr" class="login-err" role="alert"></div>
    </form>
  </div>
</div>

<div id="appView" class="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sys-id">DELTA/TOOLS</div>
      <div class="sys-role">ADMIN</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-icon">◈</span>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="users">
        <span class="nav-icon">◉</span>
        <span>Users</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙</span>
        <span>System Settings</span>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item logout" id="logoutBtn">
        <span class="nav-icon">⏻</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="pageContent"></div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="toastStack" class="toast-stack" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
