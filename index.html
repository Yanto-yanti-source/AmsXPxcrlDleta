<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Tools · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────── -->
<div id="loginView" class="login-wrap">
  <div class="login-panel">
    <div class="login-header">
      <div class="login-brand">
        <span class="brand-mark"></span>
        <span class="brand-text">DELTA<span class="brand-slash">/</span>TOOLS</span>
      </div>
      <span class="login-version">ADMIN CONSOLE</span>
    </div>
    <div class="login-sep"></div>
    <div class="login-prompt">
      <span class="prompt-caret">&gt;_</span>
      <span class="prompt-text">authenticate</span>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginEmail">EMAIL</label>
        <input type="email" id="loginEmail" required spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">PASSWORD</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn-enter" id="loginBtn">
        <span id="loginBtnText">ENTER</span>
      </button>
      <div id="loginErr" class="login-err" role="alert"></div>
    </form>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────── -->
<div id="appView" class="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sys-brand">
        <span class="brand-mark"></span>
        <div>
          <div class="sys-id">DELTA<span class="brand-slash">/</span>TOOLS</div>
          <div class="sys-role">ADMIN</div>
        </div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        </span>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="vouchers">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"></path><path d="M2 8h20v4H2z"></path><path d="M12 8v12"></path></svg>
        </span>
        <span>Vouchers</span>
      </button>
      <button class="nav-item" data-view="users">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </span>
        <span>Users</span>
      </button>
      <button class="nav-item" data-view="credits">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10"></path><path d="M9 10h6"></path></svg>
        </span>
        <span>Credits</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </span>
        <span>Settings</span>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item logout" id="logoutBtn">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="pageContent"></div>
  </main>
</div>

<!-- ── MODAL ──────────────────────────────────────────────── -->
<div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- ── TOAST ──────────────────────────────────────────────── -->
<div id="toastStack" class="toast-stack" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
